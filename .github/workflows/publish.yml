name: Publish to npm
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const p=require('./package.json');if(process.env.RELEASE_TAG!== 'v'+p.version)process.exit(1)"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run --json
      - name: Verify npm supports trusted publishing
        run: |
          npm --version
          node --version
      - name: Check if this version has already been published
        id: registry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "voipano@${VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "voipano@${VERSION} is already published; skipping upload."
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish via trusted publishing (OIDC)
        if: steps.registry.outputs.exists == 'false'
        run: npm publish --access public
