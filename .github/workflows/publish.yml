name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'voipano/node-voipano' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.13.1'
          package-manager-cache: false

      - name: Reject tracked credential files
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(\.env($|\.)|\.npmrc$|\.pypirc$|id_(rsa|ed25519)$)|\.(pem|p12|pfx|key)$'; then
            echo "::error::Potential credential file tracked"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test SDK
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify package contents
        run: npm pack --dry-run --json

      - name: Publish qualifying release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/semantic-release